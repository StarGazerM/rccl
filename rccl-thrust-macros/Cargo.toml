[package]
name = "rccl-thrust-macros"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "Shallow Thrust call macros and CUB lowering generator for RCCL"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["extra-traits", "full", "parsing", "printing", "visit", "visit-mut"] }
