[package]
name = "rccl-cuco"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "Rust-native GPU concurrent containers modeled on NVIDIA cuCollections"
homepage = "https://github.com/StarGazerM/rccl"
repository = "https://github.com/StarGazerM/rccl"
documentation = "https://docs.rs/rccl-cuco"
readme = "README.md"
include = ["src/**", "examples/**", "README.md", "LICENSE-*", "Cargo.toml"]

[features]
cuda-oxide-example = []

[dependencies]
cuda-core = { git = "https://github.com/StarGazerM/cuda-oxide.git", rev = "1c1c4210522089bc25cc32f4808b2a06e91ff9e4" }
cuda-device = { git = "https://github.com/StarGazerM/cuda-oxide.git", rev = "1c1c4210522089bc25cc32f4808b2a06e91ff9e4" }
cuda-host = { git = "https://github.com/StarGazerM/cuda-oxide.git", rev = "1c1c4210522089bc25cc32f4808b2a06e91ff9e4" }
rccl-memory = { path = "../rccl-memory" }
rccl-cub = { path = "../rccl-cub" }

[[example]]
name = "static_map"
path = "examples/static_map.rs"
test = false
required-features = ["cuda-oxide-example"]


[[example]]
name = "static_map_u64"
path = "examples/static_map_u64.rs"
test = false
required-features = ["cuda-oxide-example"]


[[example]]
name = "static_map_u64_benchmark"
path = "examples/static_map_u64_benchmark.rs"
test = false
required-features = ["cuda-oxide-example"]

[[example]]
name = "bloom"
path = "examples/bloom.rs"
test = false
required-features = ["cuda-oxide-example"]

[[example]]
name = "bloom_benchmark"
path = "examples/bloom_benchmark.rs"
test = false
required-features = ["cuda-oxide-example"]

[[example]]
name = "dynamic_map"
path = "examples/dynamic_map.rs"
test = false
required-features = ["cuda-oxide-example"]

[[example]]
name = "static_map_benchmark"
path = "examples/static_map_benchmark.rs"
test = false
required-features = ["cuda-oxide-example"]

[[example]]
name = "xxhash64_probe"
path = "examples/xxhash64_probe.rs"
test = false
required-features = ["cuda-oxide-example"]

[[example]]
name = "exact_row_set"
path = "examples/exact_row_set.rs"
test = false
required-features = ["cuda-oxide-example"]

[[example]]
name = "exact_row_set_benchmark"
path = "examples/exact_row_set_benchmark.rs"
test = false
required-features = ["cuda-oxide-example"]
