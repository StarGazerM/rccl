[package]
name = "rccl-thrust"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "Thrust-shaped host algorithm facade for RCCL"

[dependencies]
cuda-core = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "6bc513bbcdda781b13a328cf692df86f2215acf9" }
cuda-device = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "6bc513bbcdda781b13a328cf692df86f2215acf9" }
cuda-host = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "6bc513bbcdda781b13a328cf692df86f2215acf9" }
rccl-cub = { path = "../rccl-cub" }
rccl-memory = { path = "../rccl-memory" }

[features]
cuda-oxide-example = []

[[example]]
name = "constant_iterator"
path = "examples/constant_iterator.rs"
test = false
required-features = ["cuda-oxide-example"]

[[example]]
name = "constant_iterator_benchmark"
path = "examples/constant_iterator_benchmark.rs"
test = false
required-features = ["cuda-oxide-example"]

[[example]]
name = "sort"
path = "examples/sort.rs"
test = false
required-features = ["cuda-oxide-example"]

[[example]]
name = "comparison_sort"
path = "examples/comparison_sort.rs"
test = false
required-features = ["cuda-oxide-example"]

[[example]]
name = "merge"
path = "examples/merge.rs"
test = false
required-features = ["cuda-oxide-example"]

[[example]]
name = "ordering_benchmark"
path = "examples/ordering_benchmark.rs"
test = false
required-features = ["cuda-oxide-example"]
