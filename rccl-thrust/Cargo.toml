[package]
name = "rccl-thrust"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "Thrust-shaped host algorithm facade for RCCL"
homepage = "https://github.com/StarGazerM/rccl"
repository = "https://github.com/StarGazerM/rccl"
documentation = "https://docs.rs/rccl-thrust"
readme = "README.md"
include = ["src/**", "examples/**", "README.md", "LICENSE-*", "Cargo.toml"]

[dependencies]
cuda-core = { git = "https://github.com/StarGazerM/cuda-oxide.git", rev = "496c01bfc5df0dad510bc4ca76e2260d6f586b8f" }
cuda-device = { git = "https://github.com/StarGazerM/cuda-oxide.git", rev = "496c01bfc5df0dad510bc4ca76e2260d6f586b8f" }
cuda-host = { git = "https://github.com/StarGazerM/cuda-oxide.git", rev = "496c01bfc5df0dad510bc4ca76e2260d6f586b8f" }
rccl-cub = { path = "../rccl-cub" }
rccl-memory = { path = "../rccl-memory" }

[features]
cuda-oxide-example = []

[[example]]
name = "constant_iterator"
path = "examples/constant_iterator.rs"
test = false
required-features = ["cuda-oxide-example"]

[[example]]
name = "constant_iterator_benchmark"
path = "examples/constant_iterator_benchmark.rs"
test = false
required-features = ["cuda-oxide-example"]

[[example]]
name = "histogram"
path = "examples/histogram.rs"
test = false
required-features = ["cuda-oxide-example"]

[[example]]
name = "sort"
