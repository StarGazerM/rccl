[package]
name = "cuda-macros"
version = "0.2.1"
edition = "2024"
authors = ["Nihal Pasham <nihalp@nvidia.com>"]
license = "Apache-2.0"
repository = "https://github.com/NVlabs/cuda-oxide.git"
description = "Procedural macros for CUDA kernel development (#[kernel], #[device], etc.)"
readme = "README.md"

[lib]
proc-macro = true

[features]
default = ["host"]
async = []
host = []

[dependencies]
quote = "1.0"
syn = { version = "2.0", features = ["full", "visit", "visit-mut"] }
proc-macro2 = { version = "1.0", features = ["span-locations"] }
reserved-oxide-symbols = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "6bc513bbcdda781b13a328cf692df86f2215acf9" }
