[package]
name = "cuda-core"
version = "0.2.1"
edition = "2024"
description = "Safe RAII wrappers around the CUDA driver API (idiomatic host-side CUDA)"
readme = "README.md"
authors = ["Nihal Pasham <nihalp@nvidia.com>"]
license = "Apache-2.0"
repository = "https://github.com/NVlabs/cuda-oxide.git"

[dependencies]
cuda-bindings = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "97f8b2b7882f0c15ad9ce9b53abed5553920caa8" }
cuda-macros = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "97f8b2b7882f0c15ad9ce9b53abed5553920caa8", default-features = false }
anyhow = "1.0"
half = "2.7"
oxide-artifacts = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "97f8b2b7882f0c15ad9ce9b53abed5553920caa8", features = ["object-read"] }

[dev-dependencies]
oxide-artifacts = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "97f8b2b7882f0c15ad9ce9b53abed5553920caa8", features = ["object-write"] }
reserved-oxide-symbols = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "97f8b2b7882f0c15ad9ce9b53abed5553920caa8" }
trybuild = "1"
