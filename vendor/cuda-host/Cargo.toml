[package]
name = "cuda-host"
version = "0.2.1"
edition = "2024"
authors = ["Nihal Pasham <nihalp@nvidia.com>"]
license = "Apache-2.0"
repository = "https://github.com/NVlabs/cuda-oxide.git"
description = "Host-side utilities for CUDA kernel development"
readme = "README.md"

[dependencies]
half = "2.7"
sha2 = "0.10"
thiserror = "2"
cuda-macros = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "97f8b2b7882f0c15ad9ce9b53abed5553920caa8", features = ["host"] }
cuda-core = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "97f8b2b7882f0c15ad9ce9b53abed5553920caa8" }
cuda-artifact-finalizer = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "97f8b2b7882f0c15ad9ce9b53abed5553920caa8" }
ptx-parse = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "97f8b2b7882f0c15ad9ce9b53abed5553920caa8" }
cuda-async = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "97f8b2b7882f0c15ad9ce9b53abed5553920caa8", optional = true }

[features]
default = []
async = ["dep:cuda-async", "cuda-macros/async"]
