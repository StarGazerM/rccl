[package]
name = "rccl-memory"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "Stream-ordered CUDA memory resources and typed device buffers for RCCL"
homepage = "https://github.com/StarGazerM/rccl"
repository = "https://github.com/StarGazerM/rccl"
documentation = "https://docs.rs/rccl-memory"
readme = "README.md"
include = ["src/**", "examples/**", "README.md", "RMM_PARITY.md", "LICENSE-*", "Cargo.toml"]

[dependencies]
cuda-core = { git = "https://github.com/StarGazerM/cuda-oxide.git", rev = "5f7c34fddadcf250f2e45d0cffe83a3d27f2bea3" }
cuda-device = { git = "https://github.com/StarGazerM/cuda-oxide.git", rev = "5f7c34fddadcf250f2e45d0cffe83a3d27f2bea3" }
cuda-host = { git = "https://github.com/StarGazerM/cuda-oxide.git", rev = "5f7c34fddadcf250f2e45d0cffe83a3d27f2bea3" }
