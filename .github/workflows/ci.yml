name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  metadata:
    name: Metadata and formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-08-28
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check locked metadata
        run: cargo metadata --locked --no-deps --format-version 1

  host-check:
    name: Host checks (no GPU execution)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-08-28
      - name: Check workspace sources
        run: cargo check --workspace --locked
      - name: Run API tests
        run: cargo test --workspace api_tests --locked
