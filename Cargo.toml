[package]
name = "rccl"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "Umbrella crate for RCCL's Thrust-shaped and CUB-level CUDA primitives"

[workspace]
members = [
    "rccl-cub",
    "rccl-cub-macros",
    "rccl-memory",
    "rccl-thrust",
    "rccl-thrust-macros",
]

[dependencies]
rccl-cub = { path = "rccl-cub" }
rccl-thrust = { path = "rccl-thrust" }

[profile.release]
codegen-units = 1
lto = "thin"
