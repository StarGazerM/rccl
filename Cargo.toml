[package]
name = "rccl"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "Umbrella crate for RCCL's Thrust-shaped, CUB-level, and cuCollections-style CUDA primitives"
homepage = "https://github.com/StarGazerM/rccl"
repository = "https://github.com/StarGazerM/rccl"
documentation = "https://docs.rs/rccl"
include = ["src/**", "README.md", "LICENSE-*", "SECURITY.md", "CONTRIBUTING.md", "CODE_OF_CONDUCT.md", "THIRD_PARTY_NOTICES.md", "Cargo.toml"]

[workspace]
members = [
    "rccl-cuco",
    "rccl-cub",
    "rccl-memory",
    "rccl-thrust",
]

[dependencies]
rccl-cuco = { path = "rccl-cuco" }
rccl-cub = { path = "rccl-cub" }
rccl-thrust = { path = "rccl-thrust" }

[profile.release]
codegen-units = 1
# cuda-oxide embeds each library-owned device bundle as a native `.oxart`
# object inside the rlib. Rust ThinLTO assumes every rlib object contains
# LLVM bitcode and rejects that deliberately native archive member.
lto = false
