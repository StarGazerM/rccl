path = "examples/device_merge_sort_pairs_probe.rs"
test = false
required-features = ["cuda-oxide-example"]

[[example]]
name = "device_merge_sort_pairs_benchmark"
path = "examples/device_merge_sort_pairs_benchmark.rs"
test = false
required-features = ["cuda-oxide-example"]

[[example]]
