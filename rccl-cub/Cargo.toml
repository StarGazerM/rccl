[package]
name = "rccl-cub"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "Device-wide and cooperative CUDA primitives for RCCL"
homepage = "https://github.com/StarGazerM/rccl"
repository = "https://github.com/StarGazerM/rccl"
documentation = "https://docs.rs/rccl-cub"
readme = "README.md"
include = ["src/**", "examples/**", "README.md", "LICENSE-*", "Cargo.toml"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(cuda_arch_ge_80)',
    'cfg(cuda_arch_ge_90)',
    'cfg(cuda_arch_ge_100)',
] }

[features]
cuda-oxide-example = []

[dependencies]
cuda-core = { git = "https://github.com/StarGazerM/cuda-oxide.git", rev = "e3ae5f081fbf3e515ab7031779a2bfe0bb1392ed" }
cuda-device = { git = "https://github.com/StarGazerM/cuda-oxide.git", rev = "e3ae5f081fbf3e515ab7031779a2bfe0bb1392ed" }
cuda-host = { git = "https://github.com/StarGazerM/cuda-oxide.git", rev = "e3ae5f081fbf3e515ab7031779a2bfe0bb1392ed" }
rccl-memory = { path = "../rccl-memory" }

[[example]]
name = "warp_reduce"
path = "examples/warp_reduce.rs"
test = false
required-features = ["cuda-oxide-example"]

[[example]]
name = "warp_reduce_catch2"
path = "examples/warp_reduce_catch2.rs"
test = false
required-features = ["cuda-oxide-example"]

