[package]
name = "rccl-cub"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "Device-wide and cooperative CUDA primitives for RCCL"

[features]
cuda-oxide-example = []

[dependencies]
cuda-core = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "6bc513bbcdda781b13a328cf692df86f2215acf9" }
cuda-device = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "6bc513bbcdda781b13a328cf692df86f2215acf9" }
cuda-host = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "6bc513bbcdda781b13a328cf692df86f2215acf9" }
rccl-cub-macros = { path = "../rccl-cub-macros" }
rccl-memory = { path = "../rccl-memory" }

[[example]]
name = "warp_reduce"
path = "examples/warp_reduce.rs"
test = false
required-features = ["cuda-oxide-example"]

[[example]]
name = "warp_reduce_catch2"
path = "examples/warp_reduce_catch2.rs"
test = false
required-features = ["cuda-oxide-example"]

[[example]]
name = "warp_reduce_catch2_f32"
path = "examples/warp_reduce_catch2_f32.rs"
test = false
required-features = ["cuda-oxide-example"]

[[example]]
name = "warp_reduce_benchmark"
path = "examples/warp_reduce_benchmark.rs"
test = false
required-features = ["cuda-oxide-example"]

[[example]]
name = "device_ordering_probe"
path = "examples/device_ordering_probe.rs"
test = false
required-features = ["cuda-oxide-example"]

[[example]]
